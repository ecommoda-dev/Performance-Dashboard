name               = "performance-dashboard-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true

[observability]
enabled = true

[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ⚠️ الكود بيستخدم env.DASH_KV (الكاش — §CACHE في index.js).
# الـ binding ده كان متضاف يدويًا في الداشبورد. `wrangler deploy` تعريفي:
# لو الـ binding مش هنا، أول نشر من git بيشيله → env.DASH_KV = undefined
# → get_data بيرمي على كل نداء. لازم يفضل معرّف هنا.
# املا الـ id من: Cloudflare → Storage & Databases → KV → DASH_KV → Namespace ID
[[kv_namespaces]]
binding = "DASH_KV"
id      = "REPLACE_WITH_DASH_KV_NAMESPACE_ID"

[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"
LOCATION_ID = "98849620290"
